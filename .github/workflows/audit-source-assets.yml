name: Audit Project Zero Hour source models

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'scripts/audit-source-assets.ps1'
      - 'scripts/export-model-candidates.ps1'
      - 'scripts/inspect-model-candidates.mjs'
      - '.github/workflows/audit-source-assets.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: source-asset-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Extract and inspect source models
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Fetch source assets from Git LFS
        shell: pwsh
        run: |
          git lfs install
          git lfs pull --include="Assets/**,*.zip,*.exr,*.wav,*.glb"
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install Three.js model inspection dependencies
        run: npm ci
      - name: Inventory standalone and ZIP model files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          .\scripts\audit-source-assets.ps1 -IncludeAnimationOnly -OutputCsv "artifacts\source-assets.csv" -OutputJson "artifacts\source-assets.json"
      - name: Export shortlisted model candidates
        shell: pwsh
        run: .\scripts\export-model-candidates.ps1
      - name: Inspect GLB and FBX structure
        run: node scripts/inspect-model-candidates.mjs
      - name: Upload source model inventory and structural report
        uses: actions/upload-artifact@v5
        with:
          name: mindsphere-source-asset-inventory
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
