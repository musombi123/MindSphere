name: Build and deploy Project Zero Hour

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-zero-hour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Prepare and build game
        run: npm run build
      - name: Upload Pages-ready build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
