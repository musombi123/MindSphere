name: Deploy Project Zero Hour

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Validate game JavaScript
        run: |
          sed -n '/<script type="module">/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/zero-hour-game.mjs
          node --check /tmp/zero-hour-game.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
